









services:
  aquaticy:
    build:
      context: .
      target: ${AQUATICY_IMAGE_TARGET:-browser}
    image: aquaticy:local



    user: "${AQUATICY_UID:-1000}:${AQUATICY_GID:-1000}"

    env_file:
      - path: .env
        required: false
    environment:
      AQUATICY_DATA_DIR: /data

      AQUATICY_SEARXNG_URL: ${AQUATICY_SEARXNG_URL:-http://searxng:8080}
    volumes:

      - aquaticy-data:/data

      - ./exports:/work
    stdin_open: true
    tty: true
    init: true




    security_opt:
      - no-new-privileges:true

    shm_size: 512m


  searxng:
    profiles: [searxng]
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/


      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    security_opt:
      - no-new-privileges:true

volumes:
  aquaticy-data:
