# Sicherheitspruefung: bekannte Luecken in den Abhaengigkeiten (pip-audit) und im Code (bandit).
# Laeuft bei jedem Push, bei Pull Requests, jeden Montag und auf Knopfdruck. Nur Lesen.
name: Sicherheit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Werkzeuge installieren
        run: python -m pip install "pip-audit==2.10.1" "bandit==1.9.4"
      - name: Abhaengigkeiten auf bekannte Luecken pruefen
        run: pip-audit -r constraints.txt --no-deps --disable-pip --progress-spinner off
      - name: Code mit bandit pruefen (nur neue Hinweise)
        run: bandit -q -r aquaticy -ll -ii -b tools/bandit-baseline.json
