

















services:
  aquaticy-web:
    build:
      context: .
      target: web
    image: aquaticy:web
    container_name: aquaticy-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AQUATICY_DATA_DIR: /data
      AQUATICY_SANDBOXED: "1"


    ports:
      - "127.0.0.1:${AQUATICY_PORT:-8765}:8765"
    volumes:
      - aquaticy-data:/data
      - ./exports:/work



      - aquaticy-workshop:/home/aquaticy/.local/share/containers

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=64m







    init: true
    pids_limit: 512
    shm_size: 512m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/api/auth/status', timeout=5).status < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  aquaticy-data:
  aquaticy-workshop:
